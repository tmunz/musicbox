<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicBox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 1rem;
    }

    .status-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      align-items: baseline;
    }

    .status-grid .label {
      font-size: 0.8rem;
      color: #6e6e73;
      white-space: nowrap;
    }

    .status-grid .value {
      font-size: 0.95rem;
      font-family: ui-monospace, monospace;
      color: #1d1d1f;
      overflow-wrap: anywhere;
    }

    .status-grid .value.highlight {
      color: #1a7f37;
    }

    #resilience_counter {
      color: #b45309;
    }

    #live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #c7c7cc;
      margin-right: 0.4rem;
      vertical-align: middle;
      transition: background 0.3s;
    }
    #live-dot.live { background: #34c759; box-shadow: 0 0 6px #34c759; }
    #live-dot.stopped { background: #ff3b30; box-shadow: 0 0 6px #ff3b30; }
    #live-dot.error { background: #ff3b30; }

    form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    form label {
      width: 100%;
      font-size: 0.8rem;
      color: #6e6e73;
      margin-bottom: 0.25rem;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #f5f5f7;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      color: #1d1d1f;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #0071e3; }

    button[type="submit"] {
      background: #0071e3;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.55rem 1.1rem;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button[type="submit"]:hover { background: #0077ed; }

    .spotify button[type="submit"] {
      background: #1db954;
    }
    .spotify button[type="submit"]:hover {
      background: #1ed760;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
    const evtSource = new EventSource('/events');
    const dot = document.getElementById('live-dot');
    evtSource.onmessage = function(event) {
      const data = JSON.parse(event.data);
      document.getElementById('content').textContent = data.content;
      document.getElementById('tag_id').textContent = data.tag_id;
      document.getElementById('last_id').textContent = data.last_id;
      document.getElementById('current_id').textContent = data.current_id;
      document.getElementById('resilience_counter').textContent = data.resilience_counter;
      const isPlaying = data.current_id && data.current_id !== '-';
      dot.className = isPlaying ? 'live' : 'stopped';
    };
    evtSource.onerror = function() {
      dot.className = 'error';
      console.error('SSE connection lost, retrying...');
    };

    async function handleWriteData(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      writeData(formData);
    }

    async function handleWriteSpotify(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const originalData = formData.get('data');
      formData.set('data', convertSpotifyUrl(originalData));
      writeData(formData);
    }

    async function writeData(formData) {
      const urlEncodedData = new URLSearchParams();
      for (const [key, value] of formData.entries()) {
        urlEncodedData.append(key, value);
      }

      try {
        const response = await fetch('/tag/write', {
          method: 'POST',
          body: urlEncodedData
        });

        const result = await response.text();
        alert(result);
        window.location.reload();
      } catch (error) {
        console.error('Error submitting form:', error);
      }
    }

    function convertSpotifyUrl(url) {
      try {
        const urlObj = new URL(url);
        const pathSegments = urlObj.pathname.split('/');
        const type = pathSegments[1];
        const id = pathSegments[2];
        return 'spotify:' + type + ':' + id;
      } catch (error) {
        console.error('Invalid Spotify URL:', error);
        alert('Invalid Spotify URL');
        return url;
      }
    }
    }); // DOMContentLoaded
  </script>
</head>
<body>
  <div class="page">

    <div class="card" id="status-card">
      <h2><span id="live-dot"></span>Status</h2>
      <div class="status-grid">
        <span class="label">Content</span>  <span class="value highlight" id="content">$content</span>
        <span class="label">Tag</span>       <span class="value" id="tag_id">$tag_id</span>
        <span class="label">Last</span>      <span class="value" id="last_id">$last_id</span>
        <span class="label">Current</span>  <span class="value" id="current_id">$current_id</span>
        <span class="label">Resilience</span><span class="value" id="resilience_counter">$resilience_counter</span>
      </div>
    </div>

    <div class="card">
      <h2>Write data to tag</h2>
      <form id="dataForm" onsubmit="handleWriteData(event)">
        <label for="data">Data</label>
        <input type="text" name="data" required placeholder="Any text or URI">
        <button type="submit">Write</button>
      </form>
    </div>

    <div class="card spotify">
      <h2>Write Spotify URL to tag</h2>
      <form id="spotifyForm" onsubmit="handleWriteSpotify(event)">
        <label for="spotifyData">Spotify URL</label>
        <input type="text" name="data" required placeholder="https://open.spotify.com/...">
        <button type="submit">Write</button>
      </form>
    </div>

  </div>
</body>
</html>
